stages:
  - verify
  - package
  - release

default:
  interruptible: true

.docker-runner:
  tags:
    - us
    - docker
    - internet
    - aws
    - c6i-large

.macos-runner:
  resource_group: xxswitch-macos-shell
  tags:
    - shell
    - node
    - macos
    - docker-compose
    - m1
    - arm
    - nvm
    - xcode-latest

.macos-node:
  extends: .macos-runner
  before_script:
    - export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
    - test -s "$NVM_DIR/nvm.sh"
    - . "$NVM_DIR/nvm.sh"
    - nvm use 22
    - corepack enable

frontend:build:
  extends: .docker-runner
  stage: verify
  image: node:22-bookworm
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    - pnpm build
  artifacts:
    expire_in: 1 week
    paths:
      - dist/

backend:test:
  extends: .macos-runner
  stage: verify
  cache:
    key:
      files:
        - src-tauri/Cargo.lock
    paths:
      - .cargo/registry/
      - .cargo/git/
      - src-tauri/target/
  script:
    - cargo test --locked --manifest-path src-tauri/Cargo.toml

macos:preflight:
  extends: .macos-node
  stage: verify
  script:
    - test "$(uname -s)" = Darwin
    - test "$(uname -m)" = arm64
    - node --version
    - rustc --version
    - cargo --version
    - xcodebuild -version
    - |
      signing_identity="$({ security find-identity -v -p codesigning 2>/dev/null || true; } \
        | sed -n 's/^[[:space:]]*[0-9][0-9]*) \([0-9A-F][0-9A-F]*\) "Developer ID Application:.*$/\1/p' \
        | head -n 1)"
      if [ -z "$signing_identity" ]; then
        echo "No Developer ID Application signing identity is available to the Runner user." >&2
        exit 1
      fi
      echo "Developer ID Application signing identity is available."

windows:preflight:
  stage: verify
  tags:
    - node
    - windows
    - nvm
    - rust
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - nvm install 22.23.2
    - nvm use 22.23.2
  script:
    - node --version
    - corepack --version

release:validate-tag:
  extends: .docker-runner
  stage: verify
  image: node:22-bookworm
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - |
      version="${CI_COMMIT_TAG#v}"
      if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
        echo "Release tag '$CI_COMMIT_TAG' must look like v1.2.3 or v1.2.3-beta.1." >&2
        exit 1
      fi
      printf 'RELEASE_VERSION=%s\n' "$version" > release.env
    - node scripts/extract-release-notes.mjs "$CI_COMMIT_TAG" release-notes.md
  artifacts:
    reports:
      dotenv: release.env
    paths:
      - release-notes.md

release:windows:
  stage: package
  tags:
    - node
    - windows
    - nvm
    - rust
  interruptible: false
  needs:
    - job: release:validate-tag
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  before_script:
    - nvm install 22.23.2
    - nvm use 22.23.2
    - corepack enable
    - pnpm install --frozen-lockfile
  script:
    - node scripts/apply-release-version.mjs "$env:RELEASE_VERSION"
    - $env:XXSWITCH_VERSION = $env:CI_COMMIT_TAG
    - pnpm tauri build --bundles nsis
  artifacts:
    name: "xxswitch-$CI_COMMIT_TAG-windows"
    expire_in: 1 week
    paths:
      - src-tauri/target/release/bundle/nsis/*.exe
      - src-tauri/target/release/bundle/msi/*.msi

release:macos-universal:
  extends: .macos-node
  stage: package
  interruptible: false
  needs:
    - job: release:validate-tag
      artifacts: true
    - job: macos:preflight
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  before_script:
    - export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
    - test -s "$NVM_DIR/nvm.sh"
    - . "$NVM_DIR/nvm.sh"
    - nvm use 22
    - corepack enable
    - pnpm install --frozen-lockfile
    - rustup target add x86_64-apple-darwin aarch64-apple-darwin
  script:
    - node scripts/apply-release-version.mjs "$RELEASE_VERSION"
    - export XXSWITCH_VERSION="$CI_COMMIT_TAG"
    - |
      APPLE_SIGNING_IDENTITY="$({ security find-identity -v -p codesigning 2>/dev/null || true; } \
        | sed -n 's/^[[:space:]]*[0-9][0-9]*) \([0-9A-F][0-9A-F]*\) "Developer ID Application:.*$/\1/p' \
        | head -n 1)"
      test -n "$APPLE_SIGNING_IDENTITY"
      export APPLE_SIGNING_IDENTITY
      pnpm tauri build --target universal-apple-darwin --bundles dmg
    - |
      app_path="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
      test -n "$app_path"
      codesign --verify --deep --strict --verbose=2 "$app_path"
  artifacts:
    name: "xxswitch-$CI_COMMIT_TAG-macos-universal"
    expire_in: 1 week
    paths:
      - src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
      - src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
      - src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz

release:publish:
  extends: .docker-runner
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  interruptible: false
  needs:
    - job: release:validate-tag
      artifacts: true
    - job: release:windows
      artifacts: true
    - job: release:macos-universal
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - |
      set -eu
      : > release-assets
      if [ -d src-tauri/target/release/bundle ]; then
        find src-tauri/target/release/bundle -type f \
          \( -path '*/nsis/*' -o -path '*/msi/*' \) -print0 >> release-assets
      fi
      if [ -d src-tauri/target/universal-apple-darwin/release/bundle ]; then
        find src-tauri/target/universal-apple-darwin/release/bundle -type f \
          \( -name '*.dmg' -o -name '*.tar.gz' \) -print0 >> release-assets
      fi
      test -s release-assets
      release_notes="$(cat release-notes.md)"
      xargs -0 glab release create "$CI_COMMIT_TAG" \
        --name "XXSwitch $CI_COMMIT_TAG" \
        --notes "$release_notes" \
        --use-package-registry < release-assets
